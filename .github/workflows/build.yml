name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[all]"
      - name: Core engine tests
        run: python tests/test_core.py
      - name: MCP server tests
        run: python tests/test_mcp_server.py
      - name: GUI smoke tests
        run: python tests/test_gui_smoke.py

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build single-file exes
        run: python scripts/build.py
      - name: Build portable folder (no %TEMP% extraction)
        run: python scripts/build.py all --onedir
      - name: Package artifacts + checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PicPress/* -DestinationPath dist/PicPress-portable.zip -Force
          $files = @("dist/PicPress.exe", "dist/picpress-mcp.exe", "dist/PicPress-portable.zip")
          foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picpress-windows
          path: |
            dist/PicPress.exe
            dist/picpress-mcp.exe
            dist/PicPress-portable.zip
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: picpress-windows
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PicPress.exe
            dist/picpress-mcp.exe
            dist/PicPress-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Download / 下载

            | File | What it is |
            |---|---|
            | `PicPress.exe` | Desktop app — single file, no install |
            | `picpress-mcp.exe` | MCP server for AI agents (`--selftest` works offline) |
            | `PicPress-portable.zip` | Portable folder — starts faster, writes nothing to `%TEMP%` |

            Windows 10/11 x64 · fully offline · unsigned exe may trigger SmartScreen
            (*More info → Run anyway*).
