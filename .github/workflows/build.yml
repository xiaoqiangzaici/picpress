name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[all]"
      - name: Core engine tests
        run: python tests/test_core.py
      - name: MCP server tests
        run: python tests/test_mcp_server.py
      # Qt on Windows CI occasionally returns a non-zero exit code while
      # shutting down even though every test passed (the runner reports
      # "Process completed with exit code 1" right after the "OK" summary).
      # Gate on unittest's own summary instead of the process code.
      - name: GUI smoke tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python tests/test_gui_smoke.py 2>&1 | tee gui-smoke.log
          code=${PIPESTATUS[0]}
          echo "GUI suite exit code: ${code}"
          if grep -qE "^OK" gui-smoke.log; then
            echo "unittest reported OK - treating a non-zero Qt shutdown code as benign"
            exit 0
          fi
          exit "${code}"

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build portable folders
        run: python scripts/build.py
      - name: Package zips + checksums
        run: python scripts/package.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picpress-windows
          path: |
            dist/PicPress-portable.zip
            dist/picpress-mcp-portable.zip
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: picpress-windows
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PicPress-portable.zip
            dist/picpress-mcp-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Download / 下载

            | File | What it is |
            |---|---|
            | `PicPress-portable.zip` | Desktop app — unzip anywhere, run `PicPress.exe` |
            | `picpress-mcp-portable.zip` | MCP server for AI agents — unzip, point your client at `picpress-mcp.exe` |

            Windows 10/11 x64 · fully offline · portable, nothing is written to `%TEMP%`.
            The exe is unsigned, so Windows SmartScreen may ask once
            (*More info → Run anyway*).
