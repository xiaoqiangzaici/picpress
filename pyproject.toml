[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picpress"
version = "0.1.0"
description = "Compress photos to an exact target file size — desktop app + MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PicPress contributors" }]
keywords = ["image", "compression", "photo", "jpeg", "webp", "mcp", "mcp-server"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
mcp = ["mcp>=1.2"]
all = ["PySide6>=6.5", "mcp>=1.2"]
dev = ["PySide6>=6.5", "mcp>=1.2", "pyinstaller>=6.0"]

[project.scripts]
picpress = "picpress.gui:main"
picpress-mcp = "picpress.mcp_server:main"

[project.urls]
Homepage = "https://github.com/your-name/picpress"
Issues = "https://github.com/your-name/picpress/issues"

[tool.setuptools.packages.find]
where = ["src"]
